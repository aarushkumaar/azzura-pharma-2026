```yaml
# ============================================================
# AZZURRA — GitHub Pages + Supabase Edge Functions
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ==========================================================
  # JOB 1 — Deploy Static Website to GitHub Pages
  # ==========================================================
  deploy-pages:
    name: Deploy Static Site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ==========================================================
  # JOB 2 — Deploy Supabase Edge Functions
  # ==========================================================
  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ilduyhuvpiqhvbnocqxf

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Supabase CLI
      #
      # IMPORTANT:
      # Do NOT use "latest" here.
      # Pinning the version avoids GitHub release API
      # rate-limit errors when setup-cli tries to resolve latest.
      # ------------------------------------------------------
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # ------------------------------------------------------
      # Verify CLI installation
      # ------------------------------------------------------
      - name: Check Supabase CLI
        run: supabase --version

      # ------------------------------------------------------
      # Check that the access token exists
      # ------------------------------------------------------
      - name: Verify Supabase credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is not configured."
            echo "Go to GitHub → Settings → Secrets and variables → Actions"
            echo "and create a repository secret named SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          echo "Supabase access token detected."

      # ------------------------------------------------------
      # Link repository to Supabase project
      # ------------------------------------------------------
      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID"

      # ------------------------------------------------------
      # Deploy createRazorpayOrder
      # ------------------------------------------------------
      - name: Deploy createRazorpayOrder
        run: |
          supabase functions deploy createRazorpayOrder \
            --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_ID"

      # ------------------------------------------------------
      # Deploy createOrder
      # ------------------------------------------------------
      - name: Deploy createOrder
        run: |
          supabase functions deploy createOrder \
            --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_ID"

      # ------------------------------------------------------
      # Deploy verifyPayment
      # ------------------------------------------------------
      - name: Deploy verifyPayment
        run: |
          supabase functions deploy verifyPayment \
            --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_ID"

      # ------------------------------------------------------
      # Deploy initiateRefund
      # ------------------------------------------------------
      - name: Deploy initiateRefund
        run: |
          supabase functions deploy initiateRefund \
            --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_ID"

      # ------------------------------------------------------
      # Finished
      # ------------------------------------------------------
      - name: Deployment complete
        run: |
          echo "=========================================="
          echo "Supabase Edge Functions deployed!"
          echo "Project: $SUPABASE_PROJECT_ID"
          echo "=========================================="
```
